<!doctype html>
<html lang="en" class="js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    {% assign meta_title = page.title | default: site.title | escape %}
    {% assign meta_description = page.description | default: site.description | escape %}
    {% assign meta_image = page.image | default: site.image | absolute_url %}
    <title>{{ meta_title }}</title>
    <meta name="description" content="{{ meta_description }}" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:title" content="{{ meta_title }}" />
    <meta property="og:description" content="{{ meta_description }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ meta_image }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ixhen Hasani · iOS Tech Lead, CarPlay and On-device AI" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ meta_title }}" />
    <meta name="twitter:description" content="{{ meta_description }}" />
    <meta name="twitter:image" content="{{ meta_image }}" />

    <!-- Tailwind CDN (kept minimal, good enough for layout spacing + responsiveness) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Your CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>

  <body>
    {{ content }}

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
