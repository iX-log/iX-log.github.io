<section class="section" id="services">
  <div class="container-1200 text-center">
    <h2 class="section-title font-bold mb-3" style="font-family:Poppins,Inter,sans-serif;">
      Design & Development <span class="gray-lead">Toolbox</span>
    </h2>
    <p class="text-sm mb-10" style="color:var(--muted);">
      A small collection of tools I use to build, ship, and iterate quickly.
    </p>

    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-3 justify-center">
      {% assign tools = "Swift,SwiftUI,Xcode,CarPlay,Git,GitHub,Figma,Python" | split: "," %}
      {% for t in tools %}
        <div class="card py-5 px-3 text-sm font-semibold" style="color:var(--muted-2);">{{ t }}</div>
      {% endfor %}
    </div>
  </div>
</section>
