<section class="section bg-grid" id="contact">
  <div class="container-1200 text-center relative">
    <!-- <div class="section-kicker mb-3">Lorem ipsum: Crafting Experiences That Matter</div> -->
    <h2 class="section-title font-bold mb-4" style="font-family:Poppins,Inter,sans-serif;">
      Get in <span class="gray-lead">Touch</span>
    </h2>

    <p class="text-sm max-w-2xl mx-auto mb-10" style="color:var(--muted);">
      Want to discuss an iOS role, CarPlay, on-device AI or a conference talk? <br />Or why dogs are better than cats? I’m always happy to connect.
    </p>

    <div class="max-w-xl mx-auto card p-6 text-left">
      <form id="contact-form">
        <label class="block text-sm mb-2" style="color:var(--muted-2);">Full Name</label>
        <input name="name" class="w-full mb-4 rounded-lg px-4 py-3" style="border:1px solid var(--border); background: transparent; color: var(--fg);" placeholder="Your name" />

        <label class="block text-sm mb-2" style="color:var(--muted-2);">Email</label>
        <input name="email" type="email" class="w-full mb-4 rounded-lg px-4 py-3" style="border:1px solid var(--border); background: transparent; color: var(--fg);" placeholder="you@email.com" />

        <label class="block text-sm mb-2" style="color:var(--muted-2);">Subject</label>
        <input name="subject" class="w-full mb-4 rounded-lg px-4 py-3" style="border:1px solid var(--border); background: transparent; color: var(--fg);" placeholder="Let’s talk iOS" />

        <label class="block text-sm mb-2" style="color:var(--muted-2);">Description</label>
        <textarea name="message" rows="5" class="w-full mb-5 rounded-lg px-4 py-3" style="border:1px solid var(--border); background: transparent; color: var(--fg);" placeholder="Enter a description..."></textarea>

        <button class="btn-outline w-full justify-center" type="submit">
          <span aria-hidden="true">📨</span><span style="font-weight:700;">Send</span>
        </button>
      </form>
    </div>
  </div>
</section>
