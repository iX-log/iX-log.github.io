<section id="contact" class="py-20 px-6 bg-[#242424]">
  <div class="max-w-6xl mx-auto">
    <div class="text-center mb-12">
      <p class="text-[#d4ff00] mb-2 text-sm tracking-wide">CONNECT WITH ME</p>
      <h2 class="text-4xl">CONTACT ME</h2>
    </div>

    <div class="grid md:grid-cols-2 gap-12">
      <div>
        <div class="mb-8">
          <p class="text-gray-400 mb-6">
            Feel free to get in touch with me. I am always open to discussing new projects,
            creative ideas or opportunities to be part of your visions.
          </p>

          <div class="flex gap-4 mb-8">
            <a href="#" class="w-10 h-10 bg-[#3a3a3a] rounded-full flex items-center justify-center hover:bg-[#d4ff00] hover:text-black transition-colors" aria-label="GitHub">
              <span class="text-sm font-bold">GH</span>
            </a>
            <a href="#" class="w-10 h-10 bg-[#3a3a3a] rounded-full flex items-center justify-center hover:bg-[#d4ff00] hover:text-black transition-colors" aria-label="LinkedIn">
              <span class="text-sm font-bold">in</span>
            </a>
            <a href="#" class="w-10 h-10 bg-[#3a3a3a] rounded-full flex items-center justify-center hover:bg-[#d4ff00] hover:text-black transition-colors" aria-label="YouTube">
              <span class="text-sm font-bold">YT</span>
            </a>
            <a href="#" class="w-10 h-10 bg-[#3a3a3a] rounded-full flex items-center justify-center hover:bg-[#d4ff00] hover:text-black transition-colors" aria-label="Facebook">
              <span class="text-sm font-bold">f</span>
            </a>
            <a href="#" class="w-10 h-10 bg-[#3a3a3a] rounded-full flex items-center justify-center hover:bg-[#d4ff00] hover:text-black transition-colors" aria-label="Instagram">
              <span class="text-sm font-bold">IG</span>
            </a>
          </div>
        </div>

        <div class="space-y-4">
          <div class="bg-[#3a3a3a] p-4 rounded">
            <p class="text-[#d4ff00] text-sm mb-1">EMAIL</p>
            <p class="text-gray-300">info@ixhendesigns.com</p>
          </div>
          <div class="bg-[#3a3a3a] p-4 rounded">
            <p class="text-[#d4ff00] text-sm mb-1">PHONE</p>
            <p class="text-gray-300">+123 456 7890</p>
          </div>
        </div>
      </div>

      <div>
        <form id="contactForm" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <input
              type="text"
              name="name"
              placeholder="Your Name"
              class="bg-[#3a3a3a] px-4 py-3 rounded text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#d4ff00]"
              required
            />
            <input
              type="email"
              name="email"
              placeholder="Your Email"
              class="bg-[#3a3a3a] px-4 py-3 rounded text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#d4ff00]"
              required
            />
          </div>

          <textarea
            name="message"
            placeholder="Your Message"
            rows="6"
            class="w-full bg-[#3a3a3a] px-4 py-3 rounded text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#d4ff00]"
            required
          ></textarea>

          <button type="submit" class="w-full bg-[#d4ff00] text-black py-3 rounded hover:bg-[#c4ef00] transition-colors">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
