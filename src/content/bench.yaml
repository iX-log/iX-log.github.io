main:
  name: on-device-bench
  summary: >-
    An open harness that measures Core ML latency, memory, thermals and quantization on iPhone.
  pitch: What actually runs on a phone. Whisper on an A16, 25,000 inferences.
  pitchWithRepo: What actually runs on a phone. Whisper on an A16, 25,000 inferences, every sample published.
  status: In progress
  variants: fp16 · int8 · int4
  context: whisper-base encoder · iPhone 14 Pro Max · A16
  repo: https://github.com/iX-log/on-device-bench
  readouts:
    - value: '42'
      unit: ' ms'
      label: warm inference
      display: "warm inference. Day one said 2 s. That was compilation — I published it anyway, for six days."
    - value: '6–9'
      unit: ' MB'
      label: RAM for a 39.4 MB model
      display: of RAM for a 39.4 MB model.
    - value: '~100'
      unit: ' s'
      label: at full speed
      display: at full speed. Then a different machine.
      accent: true
    - value: '2.6'
      unit: ×
      label: word errors at int4, for 3% speed
      display: the word errors at int4, for 3% speed.
  chart:
    label: Latency · 12,848 samples · 10 min
    unit: ms
    stepAt: 102
    stepLabel: 102 s
    duration: 600
    low: 41.7
    high: 49.4
    alt: Latency holds at about 42 ms for 102 seconds, then steps up to about 49 ms and stays there.
